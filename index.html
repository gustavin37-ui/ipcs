<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de IPC's de Magistrados</title>
<style>
  :root {
    --bg: #0f1419;
    --bg-elev: #1a2128;
    --bg-card: #232c36;
    --bg-hover: #2d3743;
    --border: #2f3a47;
    --border-soft: #243140;
    --text: #e6ebf1;
    --text-dim: #9aa7b4;
    --text-muted: #6b7785;
    --accent: #d4af37;
    --accent-soft: rgba(212, 175, 55, 0.12);
    --accent-hover: #e8c34a;
    --danger: #d97757;
    --success: #6ab04c;
    --info: #4a9eff;
    --shadow: 0 8px 24px rgba(0,0,0,0.4);
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.25);
    --radius: 6px;
    --radius-lg: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    overflow: hidden;
  }

  /* ===== LAYOUT ===== */
  .app {
    display: grid;
    grid-template-columns: 260px 1fr;
    height: 100vh;
  }

  /* ===== SIDEBAR ===== */
  .sidebar {
    background: var(--bg-elev);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 20px 18px 16px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-header .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }
  .logo-mark {
    width: 30px; height: 30px;
    background: linear-gradient(135deg, var(--accent), #b8941f);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    color: #1a1a1a;
    font-size: 14px;
  }
  .sidebar-header h1 {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.2px;
  }
  .sidebar-header .subtitle {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .search-box {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }
  .search-input {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: var(--radius);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--text-muted); }

  .nav {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }
  .nav-section {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    padding: 14px 18px 6px;
    font-weight: 600;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 18px;
    color: var(--text-dim);
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: all 0.15s;
    font-size: 13px;
  }
  .nav-item:hover {
    background: var(--bg-hover);
    color: var(--text);
  }
  .nav-item.active {
    background: var(--accent-soft);
    color: var(--accent);
    border-left-color: var(--accent);
    font-weight: 500;
  }
  .nav-icon {
    width: 16px; height: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }

  .sidebar-footer {
    padding: 10px 18px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-muted);
  }

  /* ===== MAIN ===== */
  .main {
    overflow-y: auto;
    background: var(--bg);
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(15, 20, 25, 0.95);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border-soft);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .topbar h2 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .topbar .meta {
    color: var(--text-muted);
    font-size: 12px;
  }

  /* Botón de migración temporal */
  .btn-migrar {
    background: var(--danger);
    color: white;
    padding: 8px 16px;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    font-weight: bold;
    transition: background 0.2s;
  }
  .btn-migrar:hover { background: #b85f43; }

  .content { padding: 28px 32px 60px; }

  /* ===== HOME ===== */
  .home-hero {
    margin-bottom: 32px;
    padding: 24px 28px;
    background: linear-gradient(135deg, var(--bg-elev) 0%, var(--bg-card) 100%);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    position: relative;
    overflow: hidden;
  }
  .home-hero::before {
    content: '';
    position: absolute;
    top: -50%; right: -10%;
    width: 300px; height: 300px;
    background: radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
    pointer-events: none;
  }
  .home-hero h2 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 6px;
    letter-spacing: -0.3px;
  }
  .home-hero p { color: var(--text-dim); font-size: 14px; }

  .home-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  .home-card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .home-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: var(--shadow);
  }
  .home-card::after {
    content: '→';
    position: absolute;
    top: 16px; right: 16px;
    color: var(--text-muted);
    font-size: 16px;
    transition: all 0.2s;
  }
  .home-card:hover::after { color: var(--accent); transform: translateX(4px); }
  .home-card-icon {
    width: 36px; height: 36px;
    background: var(--accent-soft);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 12px;
    font-size: 18px;
    color: var(--accent);
  }
  .home-card h3 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 4px;
    color: var(--text);
  }
  .home-card p {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.4;
  }

  /* ===== SECTIONS ===== */
  .section { margin-bottom: 28px; }
  .section-title {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--accent);
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::before {
    content: '';
    width: 4px; height: 14px;
    background: var(--accent);
    border-radius: 2px;
  }

  /* ===== TABLE ===== */
  .table-wrap {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 18px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  thead {
    background: var(--bg-card);
    position: sticky;
    top: 0;
  }
  th {
    text-align: left;
    padding: 10px 14px;
    font-weight: 600;
    color: var(--accent);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border-soft);
    color: var(--text);
    vertical-align: top;
    white-space: pre-wrap;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  td.muted { color: var(--text-muted); }
  td .badge {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--accent);
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
  }

  /* ===== CARDS layout (for 2 columns) ===== */
  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  @media (max-width: 1100px) {
    .two-col { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .card h4 {
    color: var(--accent);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-soft);
  }

  /* ===== Notes ===== */
  .notes {
    background: rgba(74, 158, 255, 0.06);
    border-left: 3px solid var(--info);
    padding: 12px 16px;
    border-radius: 0 var(--radius) var(--radius) 0;
    font-size: 12.5px;
    color: var(--text-dim);
    margin-bottom: 18px;
  }
  .notes p { margin-bottom: 6px; }
  .notes p:last-child { margin-bottom: 0; }
  .notes .label {
    color: var(--info);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: block;
    margin-bottom: 6px;
  }

  /* ===== LINKS ===== */
  a {
    color: var(--info);
    text-decoration: none;
    border-bottom: 1px dashed transparent;
    transition: border-color 0.15s;
    word-break: break-all;
  }
  a:hover { border-bottom-color: var(--info); }
  a.tel { color: var(--success); }
  a.mail { color: var(--accent); }

  /* ===== Search highlight ===== */
  mark {
    background: var(--accent);
    color: #1a1a1a;
    padding: 0 2px;
    border-radius: 2px;
  }

  .empty {
    text-align: center;
    color: var(--text-muted);
    padding: 40px;
    font-style: italic;
  }

  /* ===== Search results ===== */
  .result-section { margin-bottom: 24px; }
  .result-tag {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--accent);
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-right: 8px;
    font-weight: 600;
    cursor: pointer;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-soft); }

  /* Util */
  code {
    background: var(--bg-card);
    color: var(--accent);
    padding: 2px 6px;
    border-radius: 3px;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 12px;
  }
  .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    background: var(--bg-card);
    color: var(--text-dim);
    border: 1px solid var(--border);
  }
  .pill.chrome { color: #ffa726; border-color: #5a4220; background: rgba(255, 167, 38, 0.08); }
  .pill.edge { color: #4a9eff; border-color: #1f3a5a; background: rgba(74, 158, 255, 0.08); }
</style>
</head>

/* ============================================================
   FUNCIÓN DE MIGRACIÓN A FIREBASE 
   ============================================================ */
async function migrarDatosAFirebase() {
  const btn = document.getElementById('btnMigrar');
  btn.textContent = '⏳ Migrando datos...';
  btn.style.background = '#d4af37'; // Color de carga (dorado)
  
  console.log("Iniciando volcado de datos a Firebase...");
  
  for (const [clave, datosOriginales] of Object.entries(DATA)) {
    try {
      // 1. Clonar los datos para no modificar tu variable local
      let datosSaneados = JSON.parse(JSON.stringify(datosOriginales));

      // 2. Buscar si hay tablas y transformar los arrays anidados en objetos
      if (datosSaneados.sections) {
        datosSaneados.sections.forEach(sec => {
          if (sec.type === 'table' && Array.isArray(sec.rows)) {
            // Convierte ['Valor1', 'Valor2'] en { 0: 'Valor1', 1: 'Valor2' }
            sec.rows = sec.rows.map(fila => Object.assign({}, fila));
          }
        });
      }

      // 3. Enviar a Firebase
      const docRef = doc(db, "guias_ipc", clave);
      await setDoc(docRef, datosSaneados);
      console.log(`✅ Subido correctamente: ${clave}`);
    } catch (error) {
      console.error(`❌ Error subiendo ${clave}:`, error);
      btn.textContent = '❌ Error en la migración';
      btn.style.background = 'var(--danger)';
      return;
    }
  }
  
  console.log("🚀 ¡Volcado completado!");
  btn.textContent = '✅ Migración Completada';
  btn.style.background = 'var(--success)';
  btn.disabled = true;
  alert("Los datos se han convertido y copiado correctamente a tu base de datos de Firebase.");
}

// Escuchamos el clic en el botón nuevo
document.getElementById('btnMigrar').addEventListener('click', migrarDatosAFirebase);

/* ============================================================
   RENDERIZADO ORIGINAL (Para que sigas viendo la web normal)
   ============================================================ */
function linkify(text) {
  if (text === null || text === undefined) return '';
  let html = escapeHTML(String(text));
  html = html.replace(/mailto:([\w._%+-]+@[\w.-]+\.[A-Za-z]{2,})/g, '<a class="mail" href="mailto:$1">$1</a>');
  html = html.replace(/(?<![\w@.:/])([\w._%+-]+@[\w.-]+\.[A-Za-z]{2,})(?![\w@])/g, '<a class="mail" href="mailto:$1">$1</a>');
  html = html.replace(/(https?:\/\/[^\s<>"']+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  html = html.replace(/(?<!\d)(\b[69]\d{8}\b)(?!\d)/g, '<a class="tel" href="tel:$1">$1</a>');
  return html;
}

function escapeHTML(str) {
  return String(str).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function renderTable(headers, rows) {
  let html = '<div class="table-wrap"><table>';
  if (headers && headers.length) {
    html += '<thead><tr>' + headers.map(h => `<th>${escapeHTML(h)}</th>`).join('') + '</tr></thead>';
  }
  html += '<tbody>';
  for (const row of rows) {
    html += '<tr>' + row.map(cell => {
      const empty = cell === '' || cell === null || cell === undefined;
      let finalCell = linkify(cell);
      if (cell === 'CHROME') finalCell = '<span class="pill chrome">CHROME</span>';
      else if (cell === 'EDGE') finalCell = '<span class="pill edge">EDGE</span>';
      else if (cell === 'EDGE/CHROME') finalCell = '<span class="pill chrome">EDGE/CHROME</span>';
      else if (cell === 'EDGE - MODO IE') finalCell = '<span class="pill edge">EDGE - MODO IE</span>';
      return `<td${empty ? ' class="muted"' : ''}>${finalCell}</td>`;
    }).join('') + '</tr>';
  }
  html += '</tbody></table></div>';
  return html;
}

function renderCards(cards) {
  let html = '<div class="two-col"><div>';
  const mid = Math.ceil(cards.length / 2);
  const col1 = cards.slice(0, mid);
  const col2 = cards.slice(mid);
  for (const c of col1) {
    html += `<div class="card"><h4>${escapeHTML(c.title)}</h4><div style="white-space:pre-wrap;font-size:13px;line-height:1.6;color:var(--text)">${linkify(c.body)}</div></div>`;
  }
  html += '</div><div>';
  for (const c of col2) {
    html += `<div class="card"><h4>${escapeHTML(c.title)}</h4><div style="white-space:pre-wrap;font-size:13px;line-height:1.6;color:var(--text)">${linkify(c.body)}</div></div>`;
  }
  html += '</div></div>';
  return html;
}

function renderPage(key) {
  const page = DATA[key];
  if (!page) return;
  document.getElementById('pageTitle').textContent = page.title;
  document.getElementById('pageMeta').textContent  = page.meta || '';
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.target === key));

  let html = '';
  if (key === 'home') {
    html += `<div class="home-hero"><h2>Gestión IPC's de Magistrados</h2><p>Guía rápida de agente — Responsables del servicio, agentes de atención y soporte, técnicos de formación.</p></div>`;
    html += '<div class="home-grid">';
    for (const c of page.cards) {
      html += `<div class="home-card" data-target="${c.id}"><div class="home-card-icon">${c.icon}</div><h3>${escapeHTML(c.title)}</h3><p>${escapeHTML(c.desc)}</p></div>`;
    }
    html += '</div>';
    document.getElementById('content').innerHTML = html;
    document.querySelectorAll('.home-card').forEach(card => {
      card.addEventListener('click', () => renderPage(card.dataset.target));
    });
    return;
  }

  for (const sec of (page.sections || [])) {
    html += `<div class="section"><div class="section-title">${escapeHTML(sec.title)}</div>`;
    if (sec.type === 'table') html += renderTable(sec.headers, sec.rows);
    else if (sec.type === 'cards') html += renderCards(sec.cards);
    html += '</div>';
  }
  if (page.notes && page.notes.length) {
    html += '<div class="notes"><span class="label">Notas</span>';
    for (const n of page.notes) html += `<p>${linkify(n)}</p>`;
    html += '</div>';
  }
  document.getElementById('content').innerHTML = html;
  document.getElementById('main').scrollTop = 0;
}

  n.addEventListener('click', () => {
    currentPage = n.dataset.target;
    document.getElementById('searchInput').value = '';
    renderPage(currentPage);
  });
});
