<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Herramientas UNIR</title>

<link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>

<style>
  :root {
    --bg: #0f1419;
    --bg-elev: #1a2128;
    --bg-card: #232c36;
    --bg-hover: #2d3743;
    --border: #2f3a47;
    --border-soft: #243140;
    --text: #e6ebf1;
    --text-dim: #9aa7b4;
    --text-muted: #6b7785;
    --accent: #d4af37;
    --accent-soft: rgba(212, 175, 55, 0.12);
    --accent-hover: #e8c34a;
    --danger: #d97757;
    --success: #6ab04c;
    --info: #4a9eff;
    --shadow: 0 8px 24px rgba(0,0,0,0.4);
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.25);
    --radius: 6px;
    --radius-lg: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    overflow: hidden;
  }

  /* ===== LAYOUT ===== */
  .app {
    display: grid;
    grid-template-columns: 260px 1fr;
    height: 100vh;
  }

  /* ===== SIDEBAR ===== */
  .sidebar {
    background: var(--bg-elev);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 20px 18px 16px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-header .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }
  .logo-mark {
    width: 44px; height: 30px;
    background: linear-gradient(135deg, var(--accent), #b8941f);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    color: #1a1a1a;
    font-size: 13px;
    letter-spacing: 0.5px;
  }
  .sidebar-header h1 {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.2px;
  }
  .sidebar-header .subtitle {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .search-box {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }
  .search-input {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: var(--radius);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--text-muted); }

  .nav {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }
  .nav-section {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    padding: 14px 18px 6px;
    font-weight: 600;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 18px;
    color: var(--text-dim);
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: all 0.15s;
    font-size: 13px;
  }
  .nav-item:hover {
    background: var(--bg-hover);
    color: var(--text);
  }
  .nav-item.active {
    background: var(--accent-soft);
    color: var(--accent);
    border-left-color: var(--accent);
    font-weight: 500;
  }
  .nav-icon {
    width: 16px; height: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }

  .sidebar-footer {
    padding: 10px 18px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-muted);
  }

  /* ===== MAIN ===== */
  .main {
    overflow-y: auto;
    background: var(--bg);
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(15, 20, 25, 0.95);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border-soft);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .topbar h2 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .topbar .meta {
    color: var(--text-muted);
    font-size: 12px;
  }

  .content { padding: 28px 32px 60px; }

  /* ===== HOME ===== */
  .home-hero {
    margin-bottom: 32px;
    padding: 24px 28px;
    background: linear-gradient(135deg, var(--bg-elev) 0%, var(--bg-card) 100%);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    position: relative;
    overflow: hidden;
  }
  .home-hero::before {
    content: '';
    position: absolute;
    top: -50%; right: -10%;
    width: 300px; height: 300px;
    background: radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
    pointer-events: none;
  }
  .home-hero h2 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 6px;
    letter-spacing: -0.3px;
  }
  .home-hero p { color: var(--text-dim); font-size: 14px; }

  .home-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  .home-card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .home-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: var(--shadow);
  }
  .home-card::after {
    content: '→';
    position: absolute;
    top: 16px; right: 16px;
    color: var(--text-muted);
    font-size: 16px;
    transition: all 0.2s;
  }
  .home-card:hover::after { color: var(--accent); transform: translateX(4px); }
  .home-card-icon {
    width: 36px; height: 36px;
    background: var(--accent-soft);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 12px;
    font-size: 18px;
    color: var(--accent);
  }
  .home-card h3 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 4px;
    color: var(--text);
  }
  .home-card p {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.4;
  }

  /* ===== SECTIONS ===== */
  .section { margin-bottom: 28px; }
  .section-title {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--accent);
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .section-title-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title-left::before {
    content: '';
    width: 4px; height: 14px;
    background: var(--accent);
    border-radius: 2px;
  }

  /* ===== TABLE ===== */
  .table-wrap {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 6px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  thead {
    background: var(--bg-card);
    position: sticky;
    top: 0;
  }
  th {
    text-align: left;
    padding: 10px 14px;
    font-weight: 600;
    color: var(--accent);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border-soft);
    color: var(--text);
    vertical-align: top;
    white-space: pre-wrap;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  td.muted { color: var(--text-muted); }

  /* ===== CARDS layout ===== */
  .card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 14px;
    width: 100%;
  }
  .card h4 {
    color: var(--accent);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-soft);
  }

  /* ===== Notes ===== */
  .notes {
    background: rgba(74, 158, 255, 0.06);
    border-left: 3px solid var(--info);
    padding: 12px 16px;
    border-radius: 0 var(--radius) var(--radius) 0;
    font-size: 12.5px;
    color: var(--text-dim);
    margin-bottom: 18px;
  }
  .notes p { margin-bottom: 6px; }
  .notes p:last-child { margin-bottom: 0; }
  .notes .label {
    color: var(--info);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: block;
    margin-bottom: 6px;
  }

  /* ===== LINKS & UTILS ===== */
  a {
    color: var(--info);
    text-decoration: none;
    border-bottom: 1px dashed transparent;
    transition: border-color 0.15s;
    word-break: break-all;
  }
  a:hover { border-bottom-color: var(--info); }
  a.tel { color: var(--success); }
  a.mail { color: var(--accent); }
  mark { background: var(--accent); color: #1a1a1a; padding: 0 2px; border-radius: 2px; }
  .empty { text-align: center; color: var(--text-muted); padding: 40px; font-style: italic; }

  /* ===== MODAL ===== */
  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100;
    backdrop-filter: blur(4px);
  }
  .modal-content {
    background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius-lg);
    width: 600px; max-width: 95%; padding: 22px; box-shadow: var(--shadow);
    transition: all 0.3s ease;
  }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border-soft); padding-bottom: 10px; }
  .modal-header h3 { color: var(--accent); font-size: 15px; font-weight: 600; }
  .modal-close { background: transparent; border: none; color: var(--text-dim); font-size: 22px; cursor: pointer; }
  .modal-close:hover { color: var(--text); }
  .modal-body { margin-bottom: 20px; display: flex; flex-direction: column; gap: 14px; max-height: 65vh; overflow-y: auto; padding-right: 4px; }
  .modal-field { display: flex; flex-direction: column; gap: 5px; }
  .modal-field label { color: var(--text-dim); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .modal-field input, .modal-field textarea, .modal-field select {
    background: var(--bg-card); border: 1px solid var(--border); color: var(--text); padding: 9px 12px; border-radius: var(--radius); font-family: inherit; font-size: 13px; outline: none; transition: border-color 0.15s;
  }
  .modal-field input:focus, .modal-field textarea:focus, .modal-field select:focus { border-color: var(--accent); }
  .modal-footer { display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid var(--border-soft); padding-top: 14px; }
  .btn-save { background: var(--accent); color: #1a1a1a; padding: 8px 18px; border: none; border-radius: var(--radius); font-weight: 600; cursor: pointer; font-size: 13px; transition: background 0.15s; }
  .btn-save:hover { background: var(--accent-hover); }
  .btn-action-ui { background: transparent; border: none; cursor: pointer; font-size: 14px; opacity: 0.4; transition: opacity 0.15s; padding: 2px; }
  .btn-action-ui:hover { opacity: 1; }
  
  /* ESTILOS PARA EDICIÓN MASIVA (BULK) - ContentEditable */
  .bulk-input {
    width: 100%; min-width: 150px; background: transparent; border: none; color: var(--text); 
    font-family: inherit; font-size: 13px; outline: none; padding: 6px;
  }
  .bulk-input:focus { background: rgba(255,255,255,0.03); }
  .bulk-input p { margin: 0; padding: 0; }

  /* ===== ESTILOS QUILL (MODO OSCURO) ===== */
  .ql-toolbar.ql-snow { border: 1px solid var(--border-soft) !important; background: var(--bg-elev); border-radius: var(--radius) var(--radius) 0 0; }
  .ql-container.ql-snow { border: 1px solid var(--border-soft) !important; background: var(--bg-card); border-radius: 0 0 var(--radius) var(--radius); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; color: var(--text); }
  .ql-editor { font-family: inherit; line-height: 1.6; padding: 15px; }
  
  .quill-card-editor .ql-editor { min-height: 200px; }
  .quill-table-editor .ql-editor { min-height: 80px; max-height: 250px; overflow-y: auto; }

  .ql-snow .ql-stroke { stroke: var(--text-dim) !important; }
  .ql-snow .ql-fill, .ql-snow .ql-stroke.ql-fill { fill: var(--text-dim) !important; }
  .ql-snow .ql-picker { color: var(--text-dim) !important; }
  .ql-editor.ql-blank::before { color: rgba(154, 167, 180, 0.5) !important; font-style: normal; }
  
  .card .ql-editor, td .ql-editor { padding: 0; min-height: auto; overflow: visible; white-space: normal; }
  td .ql-editor p { margin: 0; padding: 0; }
  
  /* ========================================================
     SISTEMA DE ROLES CSS
     ======================================================== */
  .admin-only {
    display: none !important;
  }
  body.is-admin .admin-only {
    display: inline-flex !important;
  }
  body.is-admin th.admin-only, 
  body.is-admin td.admin-only {
    display: table-cell !important;
  }
  body.is-admin div.admin-only {
    display: flex !important;
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-mark">UNIR</div>
        <h1>Herramientas UNIR</h1>
      </div>
      <div class="subtitle">Guía Rápida de Agente · v2.9</div>
    </div>

    <div class="search-box">
      <input type="text" class="search-input" id="searchInput" placeholder="🔍 Buscar en toda la guía...">
    </div>

    <nav class="nav" id="nav">
      </nav>
    <div class="sidebar-footer">Pulsa <code>Ctrl+K</code> para buscar</div>
  </aside>

  <main class="main" id="main">
    <div class="topbar">
      <div>
        <h2 id="pageTitle">Inicio</h2>
        <div class="meta" id="pageMeta"></div>
      </div>
      <div>
        <button id="authBtn" style="background: transparent; border: 1px solid var(--border); color: var(--text-dim); padding: 8px 14px; border-radius: var(--radius); cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.2s;">
          🔒 Iniciar Sesión
        </button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div id="editModal" class="modal-overlay" style="display: none;">
  <div class="modal-content" id="modalContentBox">
    <div class="modal-header">
      <h3 id="modalTitle">Editar Registro</h3>
      <button id="closeModalBtn" class="modal-close">&times;</button>
    </div>
    <div class="modal-body" id="modalBody">
      </div>
    <div class="modal-footer">
      <button id="saveModalBtn" class="btn-save">Guardar Cambios</button>
    </div>
  </div>
</div>

<div id="loginModal" class="modal-overlay" style="display: none;">
  <div class="modal-content" style="width: 350px;">
    <div class="modal-header">
      <h3>Acceso Administrador</h3>
      <button id="closeLoginBtn" class="modal-close">&times;</button>
    </div>
    <div class="modal-body">
      <div class="modal-field">
        <label>Correo Electrónico</label>
        <input type="email" id="loginEmail" placeholder="usuario@ejemplo.com">
      </div>
      <div class="modal-field">
        <label>Contraseña</label>
        <input type="password" id="loginPassword" placeholder="••••••••">
      </div>
      <div id="loginError" style="color: var(--danger); font-size: 12px; display: none; margin-top: 10px; font-weight: 600;"></div>
    </div>
    <div class="modal-footer">
      <button id="submitLoginBtn" class="btn-save">Entrar al Sistema</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, collection, getDocs, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBc_rVSeTa-RVG9jMvuNoTlKVFIMfVlCQE",
  authDomain: "ipcs-d53da.firebaseapp.com",
  projectId: "ipcs-d53da",
  storageBucket: "ipcs-d53da.firebasestorage.app",
  messagingSenderId: "442643842999",
  appId: "1:442643842999:web:b9aeef8f91e69eeaeb8a32"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app); 

let LOCAL_DATA = {};
let SEARCH_INDEX = [];

let currentEditPage = null;
let currentEditSection = null;
let currentEditIndex = null;
let currentEditType = null; 

// Controles Globales para Editores Quill
window.currentQuill = null; 
window.currentTableQuills = {}; 

/* ============================================================
   LÓGICA DE AUTENTICACIÓN Y ROLES
   ============================================================ */
onAuthStateChanged(auth, (user) => {
  if (user) {
    document.body.classList.add('is-admin');
    const authBtn = document.getElementById('authBtn');
    authBtn.innerHTML = '🔓 Cerrar Sesión';
    authBtn.style.color = 'var(--danger)';
    authBtn.style.borderColor = 'var(--danger)';
  } else {
    document.body.classList.remove('is-admin');
    const authBtn = document.getElementById('authBtn');
    authBtn.innerHTML = '🔒 Iniciar Sesión';
    authBtn.style.color = 'var(--text-dim)';
    authBtn.style.borderColor = 'var(--border)';
  }
});

document.getElementById('authBtn').addEventListener('click', () => {
  if (auth.currentUser) {
    if (confirm("¿Estás seguro de que quieres cerrar sesión y salir del modo administrador?")) {
      signOut(auth);
    }
  } else {
    document.getElementById('loginModal').style.display = 'flex';
  }
});

document.getElementById('closeLoginBtn').addEventListener('click', () => {
  document.getElementById('loginModal').style.display = 'none';
});

document.getElementById('submitLoginBtn').addEventListener('click', async () => {
  const email = document.getElementById('loginEmail').value;
  const pass = document.getElementById('loginPassword').value;
  const errorDiv = document.getElementById('loginError');
  const btn = document.getElementById('submitLoginBtn');
  
  errorDiv.style.display = 'none';
  btn.textContent = 'Verificando...';
  
  try {
    await signInWithEmailAndPassword(auth, email, pass);
    document.getElementById('loginModal').style.display = 'none';
    document.getElementById('loginPassword').value = ''; 
  } catch (error) {
    errorDiv.textContent = '⚠️ Credenciales incorrectas. Verifica tu correo y contraseña.';
    errorDiv.style.display = 'block';
  } finally {
    btn.textContent = 'Entrar al Sistema';
  }
});

/* ============================================================
   INICIALIZACIÓN
   ============================================================ */
async function initApp() {
  document.getElementById('content').innerHTML = '<div class="empty">Conectando con Firebase y descargando base de datos... ⏳</div>';
  try {
    const querySnapshot = await getDocs(collection(db, "guias_ipc"));
    querySnapshot.forEach((doc) => {
      LOCAL_DATA[doc.id] = doc.data();
    });
    
    if (!LOCAL_DATA['home']) {
        LOCAL_DATA['home'] = { title: "Inicio", cards: [] };
    }

    buildSearchIndex();
    renderSidebar(); 
    renderPage('home');
  } catch (error) {
    console.error("Error crítico inicializando base de datos:", error);
    document.getElementById('content').innerHTML = '<div class="empty" style="color:var(--danger)">Error al conectar con la nube. Verifica la conexión o las reglas de Firebase.</div>';
  }
}

/* ============================================================
   GENERADOR PDF
   ============================================================ */
window.exportarTodoAPDF = function() {
  const printDiv = document.createElement('div');
  printDiv.id = 'print-container';
  printDiv.style.cssText = 'background: white; color: black; font-family: sans-serif; padding: 20px;';

  let printHtml = `
    <div style="text-align:center; margin-bottom: 40px;">
      <h1 style="font-size: 28px; margin-bottom: 5px;">Guía de Herramientas UNIR</h1>
      <p style="color: #666;">Exportación completa de procedimientos y enlaces</p>
    </div>
  `;

  // Iterar en el orden configurado en el Inicio
  const order = (LOCAL_DATA['home']?.cards || []).map(c => c.id);
  
  order.forEach((key, index) => {
    const page = LOCAL_DATA[key];
    if (!page) return;

    // Evitamos salto de página en el primer elemento para no dejar un folio en blanco tras el título
    const pageBreak = index === 0 ? '' : 'page-break-before: always;';

    printHtml += `<div style="${pageBreak} margin-bottom: 30px;">`;
    printHtml += `<h2 style="color: #1a2128; border-bottom: 2px solid #d4af37; padding-bottom: 8px; margin-bottom: 20px; font-size: 22px;">${escapeHTML(page.title)}</h2>`;

    (page.sections || []).forEach(sec => {
      printHtml += `<h3 style="color: #2d3743; margin-top: 25px; margin-bottom: 12px; font-size: 16px;">${escapeHTML(sec.title)}</h3>`;
      
      if (sec.type === 'table') {
        printHtml += `<table style="width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 12px; page-break-inside: auto;">`;
        if (sec.headers && sec.headers.length) {
          printHtml += `<thead><tr>`;
          sec.headers.forEach(h => {
            printHtml += `<th style="border: 1px solid #aaa; padding: 8px; background: #f4f4f4; text-align:left; color: #333;">${escapeHTML(h)}</th>`;
          });
          printHtml += `</tr></thead>`;
        }
        printHtml += `<tbody>`;
        (sec.rows || []).forEach(row => {
          printHtml += `<tr style="page-break-inside: avoid;">`;
          (sec.headers || []).forEach((_, idx) => {
            let cell = row[idx] !== undefined ? String(row[idx]) : '';
            // Importante mantener espacios para formato plano exportado
            printHtml += `<td style="border: 1px solid #aaa; padding: 8px; color: #000; white-space: pre-wrap;">${smartFormat(cell)}</td>`;
          });
          printHtml += `</tr>`;
        });
        printHtml += `</tbody></table>`;
      } else if (sec.type === 'cards') {
        (sec.cards || []).forEach(card => {
          printHtml += `<div style="border: 1px solid #aaa; border-radius: 6px; padding: 15px; margin-bottom: 15px; page-break-inside: avoid; background: #fefefe;">
            <h4 style="margin: 0 0 10px 0; color: #1a2128; font-size: 14px; border-bottom: 1px solid #eee; padding-bottom: 5px;">${escapeHTML(card.title)}</h4>
            <div style="font-size: 13px; color: #333; line-height: 1.5;">${card.body}</div>
          </div>`;
        });
      }
    });

    if (page.notes && page.notes.length) {
      printHtml += `<div style="margin-top: 20px; padding: 12px; background: #fffcf0; border-left: 4px solid #d4af37; font-size: 12px; page-break-inside: avoid;">
        <strong style="display:block; margin-bottom: 5px;">Notas:</strong><ul style="margin:0; padding-left: 20px;">`;
      page.notes.forEach(n => {
        printHtml += `<li style="margin-bottom: 4px;">${smartFormat(n)}</li>`;
      });
      printHtml += `</ul></div>`;
    }

    printHtml += `</div>`;
  });

  printDiv.innerHTML = printHtml;
  document.body.appendChild(printDiv);

  const style = document.createElement('style');
  style.id = 'print-style';
  style.innerHTML = `
    @media print {
      /* CLAVE PARA IMPRIMIR TODO: Liberamos el height y el overflow */
      html, body { 
        height: auto !important; 
        overflow: visible !important; 
        background: white !important; 
        margin: 0; 
        padding: 0; 
      }
      .app, .modal-overlay, #loginModal { display: none !important; }
      #print-container { display: block !important; }
      a { text-decoration: none; color: #1a0dab; }
      .ql-editor { padding: 0; overflow: visible !important; }
      /* Prevenir que el fondo oscuro afecte a los textos dentro de Quill */
      .ql-editor * { color: black !important; }
    }
  `;
  document.head.appendChild(style);

  setTimeout(() => {
    window.print();
    document.body.removeChild(printDiv);
    document.head.removeChild(style);
  }, 300);
}

/* ============================================================
   RENDERIZADO INTERFAZ Y MENÚ
   ============================================================ */
window.renderSidebar = function() {
  const nav = document.getElementById('nav');
  let html = `
    <div class="nav-section">Navegación</div>
    <div class="nav-item ${currentPage === 'home' ? 'active' : ''}" data-target="home">
      <span class="nav-icon">🏠</span> Inicio
    </div>
    <div class="nav-section">Categorías Documentales</div>
  `;
  
  const homeCards = LOCAL_DATA['home']?.cards || [];
  
  homeCards.forEach(c => {
    html += `
      <div class="nav-item ${currentPage === c.id ? 'active' : ''}" data-target="${c.id}">
        <span class="nav-icon">${escapeHTML(c.icon)}</span> ${escapeHTML(c.title)}
      </div>
    `;
  });
  
  nav.innerHTML = html;

  nav.querySelectorAll('.nav-item').forEach(n => {
    n.addEventListener('click', () => {
      currentPage = n.dataset.target;
      document.getElementById('searchInput').value = '';
      renderPage(currentPage);
      renderSidebar();
    });
  });
}

function smartFormat(text) {
  if (!text) return '';
  const str = String(text);
  if (/<[a-z][\s\S]*>/i.test(str)) {
    return str; 
  }
  return linkify(str); 
}

function renderTable(headers, rows, pageKey, sectionIndex) {
  let html = '<div class="table-wrap"><table>';
  if (headers && headers.length) {
    html += '<thead><tr>' + headers.map(h => `<th>${escapeHTML(h)}</th>`).join('');
    html += '<th class="admin-only" style="text-align: right; width: 75px;">Gestión</th></tr></thead>';
  }
  html += '<tbody>';
  
  for (let i = 0; i < (rows || []).length; i++) {
    const rowObj = rows[i];
    
    html += '<tr>';
    for (let j = 0; j < (headers || []).length; j++) {
      let cellStr = rowObj[j] !== undefined ? String(rowObj[j]) : '';
      const empty = cellStr === '' || cellStr.trim() === '';
      
      let finalCell = smartFormat(cellStr);
      
      if (cellStr === 'CHROME') finalCell = '<span class="pill chrome">CHROME</span>';
      else if (cellStr === 'EDGE') finalCell = '<span class="pill edge">EDGE</span>';
      else if (cellStr === 'EDGE/CHROME') finalCell = '<span class="pill chrome">EDGE/CHROME</span>';
      else if (cellStr === 'EDGE - MODO IE') finalCell = '<span class="pill edge">EDGE - MODO IE</span>';
      
      html += `<td${empty ? ' class="muted"' : ''}><div class="${/<[a-z][\s\S]*>/i.test(cellStr) ? 'ql-editor' : ''}">${finalCell}</div></td>`;
    }

    html += `
      <td class="admin-only" style="text-align: right; vertical-align: middle; white-space: nowrap;">
        <button class="btn-action-ui" onclick="editarFila('${pageKey}', ${sectionIndex}, ${i})" title="Editar Fila Individual">✏️</button>
        <button class="btn-action-ui" onclick="eliminarFila('${pageKey}', ${sectionIndex}, ${i})" title="Eliminar Fila" style="margin-left: 6px;">🗑️</button>
      </td>
    </tr>`;
  }
  html += '</tbody></table></div>';
  
  html += `<button class="admin-only" onclick="añadirFilaNueva('${pageKey}', ${sectionIndex})" style="background: transparent; border: 1px dashed var(--border); color: var(--text-dim); padding: 6px 12px; border-radius: var(--radius); cursor: pointer; font-size: 11px; margin-bottom: 14px; font-weight: 500; transition: all 0.2s; align-items: center; gap: 4px; text-transform: uppercase; letter-spacing: 0.5px;">+ Añadir Fila</button>`;
  return html;
}

function renderCards(cards, pageKey, sectionIndex) {
  let html = '<div>'; 
  
  function createCardHtml(c, index) {
    return `
      <div class="card" style="position: relative; padding-top: 24px;">
        <div class="admin-only" style="position: absolute; top: 10px; right: 12px; gap: 4px; z-index: 10;">
          <button class="btn-action-ui" onclick="editarCard('${pageKey}', ${sectionIndex}, ${index})" title="Editar">✏️</button>
          <button class="btn-action-ui" onclick="eliminarCard('${pageKey}', ${sectionIndex}, ${index})" title="Eliminar">🗑️</button>
        </div>
        <h4>${escapeHTML(c.title)}</h4>
        <div class="ql-editor">${c.body}</div>
      </div>`;
  }

  for (let i = 0; i < (cards || []).length; i++) {
    html += createCardHtml(cards[i], i);
  }

  html += '</div>';
  html += `<button class="admin-only" onclick="añadirCardNueva('${pageKey}', ${sectionIndex})" style="background: transparent; border: 1px dashed var(--border); color: var(--text-dim); padding: 6px 12px; border-radius: var(--radius); cursor: pointer; font-size: 11px; margin-bottom: 14px; font-weight: 500; align-items: center; gap: 4px; text-transform: uppercase; letter-spacing: 0.5px;">+ Añadir Tarjeta</button>`;
  return html;
}

window.renderPage = function(key) {
  const page = LOCAL_DATA[key];
  if (!page) return;
  
  document.getElementById('pageTitle').textContent = page.title || key;
  document.getElementById('pageMeta').textContent  = page.meta || '';
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.target === key));

  let html = '';
  if (key === 'home') {
    html += `
      <div class="home-hero">
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
          <div>
            <h2>Herramientas UNIR</h2>
            <p>Guía rápida de agente — Responsables del servicio, agentes de atención y soporte, técnicos de formación.</p>
            <button onclick="exportarTodoAPDF()" style="margin-top: 15px; background: var(--info); color: #fff; padding: 8px 16px; border: none; border-radius: var(--radius); cursor: pointer; font-size: 13px; font-weight: 600; transition: background 0.2s; display: inline-flex; align-items: center; gap: 6px;">
              📄 Exportar toda la guía a PDF
            </button>
          </div>
          <button class="admin-only" onclick="gestionarMenu()" style="background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: var(--text); padding: 8px 14px; border-radius: var(--radius); cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.2s;">⚙️ Administrar Categorías</button>
        </div>
      </div>`;
    html += '<div class="home-grid">';
    for (const c of (page.cards || [])) {
      html += `<div class="home-card" data-target="${c.id}"><div class="home-card-icon">${c.icon}</div><h3>${escapeHTML(c.title)}</h3><p>${escapeHTML(c.desc)}</p></div>`;
    }
    html += '</div>';
    document.getElementById('content').innerHTML = html;
    document.querySelectorAll('.home-card').forEach(card => {
      card.addEventListener('click', () => {
        currentPage = card.dataset.target;
        renderPage(currentPage);
        renderSidebar();
      });
    });
    return;
  }

  for (let s = 0; s < (page.sections || []).length; s++) {
    const sec = page.sections[s];
    html += `<div class="section">
      <div class="section-title">
        <span class="section-title-left">${escapeHTML(sec.title)}</span>
        
        <div class="admin-only" style="gap: 12px; align-items: center;">
          <button onclick="editarTablaCompleta('${key}', ${s})" style="background:transparent; border:none; color:var(--info); cursor:pointer; font-size:13px; opacity:0.8; transition:opacity 0.2s;" title="Edición masiva de todas las celdas (Modo Excel)" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.8">📝 Editar Datos</button>
          
          <button onclick="gestionarTabla('${key}', ${s})" style="background:transparent; border:none; color:var(--text-dim); cursor:pointer; font-size:13px; opacity:0.6; transition:opacity 0.2s;" title="Modificar estructura de Columnas/Sección" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.6">⚙️ Configurar</button>
          
          <button onclick="eliminarSeccion('${key}', ${s})" style="background:transparent; border:none; color:var(--danger); cursor:pointer; font-size:14px; opacity:0.6; transition:opacity 0.2s;" title="Eliminar Sección Completa" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.6">🗑️</button>
        </div>

      </div>`;
    
    if (sec.type === 'table') html += renderTable(sec.headers, sec.rows, key, s);
    else if (sec.type === 'cards') html += renderCards(sec.cards, key, s);
    
    html += '</div>';
  }
  
  html += `
    <div class="admin-only" style="margin-top: 24px; text-align: center;">
      <button onclick="añadirSeccionNueva('${key}')" style="background: transparent; border: 1px dashed var(--text-muted); color: var(--text-dim); padding: 10px 20px; border-radius: var(--radius); cursor: pointer; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; width: 100%; transition: all 0.2s;" onmouseover="this.style.borderColor='var(--accent)'; this.style.color='var(--accent)';" onmouseout="this.style.borderColor='var(--text-muted)'; this.style.color='var(--text-dim)';">
        ➕ Añadir Nueva Sección
      </button>
    </div>
  `;

  if (page.notes && page.notes.length) {
    html += '<div class="notes" style="margin-top: 20px;"><span class="label">Notas</span>';
    for (const n of page.notes) html += `<p>${linkify(n)}</p>`;
    html += '</div>';
  }
  
  document.getElementById('content').innerHTML = html;
  document.getElementById('main').scrollTop = 0;
}

/* ============================================================
   LÓGICA ADMINISTRATIVA (MODALES Y REDIMENSIÓN)
   ============================================================ */
const modal = document.getElementById('editModal');
const modalContentBox = document.getElementById('modalContentBox');

function abrirModal(mode = 'normal') { 
  modal.style.display = 'flex'; 
  
  if (mode === 'fullscreen') {
    modalContentBox.style.width = '96vw';
    modalContentBox.style.height = '96vh';
    modalContentBox.style.maxWidth = '1600px';
    document.getElementById('modalBody').style.maxHeight = 'calc(96vh - 140px)';
    document.getElementById('modalBody').style.height = 'calc(96vh - 140px)';
  } else if (mode === 'bulk') {
    modalContentBox.style.width = '95vw';
    modalContentBox.style.height = 'auto';
    modalContentBox.style.maxWidth = '1400px';
    document.getElementById('modalBody').style.maxHeight = '75vh';
    document.getElementById('modalBody').style.height = 'auto';
  } else {
    modalContentBox.style.width = '600px';
    modalContentBox.style.height = 'auto';
    modalContentBox.style.maxWidth = '95%';
    document.getElementById('modalBody').style.maxHeight = '65vh';
    document.getElementById('modalBody').style.height = 'auto';
  }
}

function cerrarModal() { 
  modal.style.display = 'none'; 
  window.currentQuill = null;
  window.currentTableQuills = {};
}
document.getElementById('closeModalBtn').addEventListener('click', cerrarModal);

// ---- 1. CREACIÓN / ELIMINACIÓN DE SECCIONES DESDE CERO ----
window.añadirSeccionNueva = function(pageKey) {
  currentEditPage = pageKey;
  currentEditType = 'new_section';
  document.getElementById('modalTitle').textContent = 'Añadir Nueva Sección';
  document.getElementById('modalBody').innerHTML = `
    <div class="modal-field">
      <label>Título de la Sección</label>
      <input type="text" id="newSectionTitle" placeholder="Ej: Nueva Normativa o Contactos">
    </div>
    <div class="modal-field" style="margin-top: 10px;">
      <label>Tipo de Contenido</label>
      <select id="newSectionType">
        <option value="table">Tabla de Datos (Filas y Columnas)</option>
        <option value="cards">Tarjetas (Plantillas / Textos Largos)</option>
      </select>
    </div>
  `;
  abrirModal('normal');
}

window.eliminarSeccion = async function(pageKey, sectionIndex) {
  if (!confirm("⚠️ ATENCIÓN: ¿Estás seguro de que deseas borrar TODA esta sección y todos los datos que contiene? Esta acción no se puede deshacer.")) return;
  LOCAL_DATA[pageKey].sections.splice(sectionIndex, 1);
  await guardarEnFirebase(pageKey);
}

// ---- 2. EDICIÓN MASIVA (MODO EXCEL) ----
window.editarTablaCompleta = function(pageKey, sectionIndex) {
  currentEditPage = pageKey;
  currentEditSection = sectionIndex;
  currentEditType = 'bulk_table';

  const sec = LOCAL_DATA[pageKey].sections[sectionIndex];
  const headers = sec.headers || [];
  const rows = sec.rows || [];

  document.getElementById('modalTitle').textContent = `Edición Masiva — ${sec.title}`;
  
  let html = `<div style="overflow-x:auto; max-height: 55vh; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom:10px;">
    <table style="width:100%; border-collapse: collapse; min-width: max-content;" id="bulkEditTable">
      <thead style="background: var(--bg-card); position: sticky; top: 0; z-index: 2;">
        <tr>
          <th style="width: 30px; padding: 8px;"></th>
          ${headers.map(h => `<th style="padding: 8px; color: var(--accent); font-size: 11px; text-transform: uppercase; border-bottom: 1px solid var(--border); text-align: left;">${escapeHTML(h)}</th>`).join('')}
          <th style="width: 40px; padding: 8px; border-bottom: 1px solid var(--border);"></th>
        </tr>
      </thead>
      <tbody id="bulkEditTbody">
  `;

  rows.forEach((rowObj, rIdx) => {
    html += `<tr class="bulk-row">
      <td style="padding: 4px; text-align:center; color: var(--text-muted); font-size: 10px; border-bottom: 1px solid var(--border-soft);">${rIdx + 1}</td>
    `;
    headers.forEach((_, cIdx) => {
      const val = rowObj[cIdx] !== undefined ? rowObj[cIdx] : '';
      html += `<td style="padding: 0; border-bottom: 1px solid var(--border-soft); border-right: 1px solid var(--border-soft);">
        <div class="bulk-input" contenteditable="true" data-col="${cIdx}">${val}</div>
      </td>`;
    });
    html += `<td style="padding: 4px; text-align:center; border-bottom: 1px solid var(--border-soft);"><button onclick="this.closest('tr').remove()" style="color:var(--danger); background:transparent; border:none; cursor:pointer;" title="Eliminar Fila">🗑️</button></td></tr>`;
  });

  html += `</tbody></table></div>
  <button onclick="añadirFilaBulk()" style="background:transparent; border:1px dashed var(--border); color:var(--text-dim); padding:6px 12px; border-radius:var(--radius); cursor:pointer; font-size:11px; text-transform:uppercase; letter-spacing:0.5px;">+ Añadir Fila</button>
  <div style="margin-top:10px; font-size: 11px; color: var(--info);">💡 Tip: La cuadrícula conserva los estilos (negritas, enlaces) que creaste individualmente.</div>
  `;

  document.getElementById('modalBody').innerHTML = html;
  abrirModal('bulk');
}

window.añadirFilaBulk = function() {
  const sec = LOCAL_DATA[currentEditPage].sections[currentEditSection];
  const headers = sec.headers || [];
  const tbody = document.getElementById('bulkEditTbody');
  
  const tr = document.createElement('tr');
  tr.className = 'bulk-row';
  let html = `<td style="padding: 4px; text-align:center; color: var(--success); font-size: 12px; border-bottom: 1px solid var(--border-soft);">✨</td>`;
  headers.forEach((_, cIdx) => {
    html += `<td style="padding: 0; border-bottom: 1px solid var(--border-soft); border-right: 1px solid var(--border-soft);">
        <div class="bulk-input" contenteditable="true" data-col="${cIdx}"></div>
      </td>`;
  });
  html += `<td style="padding: 4px; text-align:center; border-bottom: 1px solid var(--border-soft);"><button onclick="this.closest('tr').remove()" style="color:var(--danger); background:transparent; border:none; cursor:pointer;" title="Eliminar Fila">🗑️</button></td>`;
  tr.innerHTML = html;
  tbody.appendChild(tr);
}

// ---- 3. CONFIGURACIÓN DE TABLAS (CABECERAS / COLUMNAS) ----
window.gestionarTabla = function(pageKey, sectionIndex) {
  currentEditPage = pageKey;
  currentEditSection = sectionIndex;
  currentEditType = 'table_config';

  const sec = LOCAL_DATA[pageKey].sections[sectionIndex];
  document.getElementById('modalTitle').textContent = `Configurar Estructura`;

  let html = `
    <div class="modal-field" style="margin-bottom:20px;">
      <label>Título de la Sección</label>
      <input type="text" id="sectionTitleInput" value="${escapeHTML(sec.title)}">

  if (sec.type === 'table') {
    html += `
      <div class="modal-field">
        <label>Columnas (Cabeceras)</label>

    `;

      html += `
        <div class="col-edit-row" data-original-index="${idx}" style="display:flex; gap:8px; align-items:center;">

          <input type="text" class="col-name" value="${escapeHTML(h)}" style="flex:1;">

        </div>`;
    });

    html += `
        </div>
        <button onclick="añadirColumnaTabla()" style="margin-top:14px; background:transparent; border:1px dashed var(--border); color:var(--text-dim); padding:6px 12px; border-radius:var(--radius); cursor:pointer; font-size:11px; text-transform:uppercase; letter-spacing:0.5px;">+ Añadir Columna</button>
      </div>`;

  document.getElementById('modalBody').innerHTML = html;

window.añadirColumnaTabla = function() {
  const div = document.createElement('div');
  div.className = 'col-edit-row';
  div.style.cssText = 'display:flex; gap:8px; align-items:center; animation: fadeIn 0.2s ease;';

    <span style="color:var(--success); font-size:12px; width:20px;">✨</span>

// ---- OPERACIONES SOBRE FILAS INDIVIDUALES (AQUÍ APLICAMOS QUILL) ----
window.editarFila = function(pageKey, sectionIndex, rowIndex) {
  currentEditPage = pageKey;
  currentEditSection = sectionIndex;
  currentEditIndex = rowIndex;
  currentEditType = 'row';

  const section = LOCAL_DATA[pageKey].sections[sectionIndex];
  const headers = section.headers || [];
  const rowObj = section.rows[rowIndex] || {};
  
  document.getElementById('modalTitle').textContent = `Editar Fila con Herramientas Avanzadas`;
  
  let bodyHtml = '';
  headers.forEach((header, idx) => {
    bodyHtml += `
      <div class="modal-field" style="margin-bottom: 16px;">
        <label>${escapeHTML(header)}</label>
        <div id="quill-col-${idx}" class="quill-table-editor"></div>
      </div>`;
  });
  
  document.getElementById('modalBody').innerHTML = bodyHtml;
  abrirModal('fullscreen'); 
  
  setTimeout(() => {
    window.currentTableQuills = {};
    headers.forEach((header, idx) => {
      const q = new Quill(`#quill-col-${idx}`, {
        theme: 'snow',
        modules: {
          toolbar: [
            ['bold', 'italic', 'underline', 'strike'],
            [{ 'list': 'ordered'}, { 'list': 'bullet' }],
            [{ 'color': [] }, { 'background': [] }],
            ['link', 'clean']
          ]
        }
      });
      q.clipboard.dangerouslyPasteHTML(rowObj[idx] !== undefined ? String(rowObj[idx]) : '');
      window.currentTableQuills[idx] = q;
    });
  }, 50);
}

window.añadirFilaNueva = function(pageKey, sectionIndex) {
  currentEditPage = pageKey;
  currentEditSection = sectionIndex;
  currentEditType = 'new_row';

  const section = LOCAL_DATA[pageKey].sections[sectionIndex];
  const headers = section.headers || [];
  
  document.getElementById('modalTitle').textContent = `Añadir Fila con Herramientas Avanzadas`;
  
  let bodyHtml = '';
  headers.forEach((header, idx) => {
    bodyHtml += `
      <div class="modal-field" style="margin-bottom: 16px;">
        <label>${escapeHTML(header)}</label>
        <div id="quill-col-${idx}" class="quill-table-editor"></div>
      </div>`;
  });
  
  document.getElementById('modalBody').innerHTML = bodyHtml;
  abrirModal('fullscreen');
  
  setTimeout(() => {
    window.currentTableQuills = {};

  const cards = LOCAL_DATA['home'].cards || [];

  html += '<div id="menuEditorList" style="display:flex; flex-direction:column; gap:10px;">';
  
  cards.forEach((c) => {
    html += `
      <div class="menu-edit-row" style="display:flex; gap:8px; align-items:center; background:var(--bg-card); padding:8px; border-radius:var(--radius); border:1px solid var(--border);">
        <div style="display:flex; flex-direction:column; gap:2px; margin-right:4px;">
          <button onclick="moverFilaMenu(this, -1)" style="background:transparent; border:none; cursor:pointer; font-size:14px; color:var(--text-dim);" title="Subir">⬆️</button>

        <button onclick="this.parentElement.remove()" style="color:var(--danger); background:transparent; border:none; cursor:pointer; font-size:16px; margin-left:4px;" title="Eliminar Categoría">🗑️</button>

}

window.añadirFilaMenu = function() {
  const container = document.getElementById('menuEditorList');
  const div = document.createElement('div');
  div.className = 'menu-edit-row';
  div.style.cssText = 'display:flex; gap:8px; align-items:center; background:var(--bg-card); padding:8px; border-radius:var(--radius); border:1px solid var(--border);';
  
  div.innerHTML = `
    <div style="display:flex; flex-direction:column; gap:2px; margin-right:4px;">
      <button onclick="moverFilaMenu(this, -1)" style="background:transparent; border:none; cursor:pointer; font-size:14px; color:var(--text-dim);" title="Subir">⬆️</button>
      <button onclick="moverFilaMenu(this, 1)" style="background:transparent; border:none; cursor:pointer; font-size:14px; color:var(--text-dim);" title="Bajar">⬇️</button>
    </div>
    <input type="text" class="menu-icon" placeholder="📁" style="width:45px; text-align:center; padding: 6px;" title="Icono">
    <input type="text" class="menu-id" placeholder="id_nuevo" style="width:100px; padding: 6px; border-color: var(--info);" title="Escribe un ID sin espacios">
    <input type="text" class="menu-title" placeholder="Título visible" style="flex:1; padding: 6px;">
    <input type="text" class="menu-desc" placeholder="Descripción breve..." style="flex:1.5; padding: 6px;">
    <button onclick="this.parentElement.remove()" style="color:var(--danger); background:transparent; border:none; cursor:pointer; font-size:16px; margin-left:4px;">🗑️</button>
  `;
  container.appendChild(div);
}

window.moverFilaMenu = function(btn, dir) {
  const row = btn.closest('.menu-edit-row');
  if (dir === -1 && row.previousElementSibling) {
    row.parentNode.insertBefore(row, row.previousElementSibling);
  } else if (dir === 1 && row.nextElementSibling) {
    row.parentNode.insertBefore(row.nextElementSibling, row);
  }
}

// ---- GUARDADO MAESTRO EN CLOUD FIRESTORE ----
document.getElementById('saveModalBtn').addEventListener('click', async () => {
  const btn = document.getElementById('saveModalBtn');
  btn.textContent = 'Guardando... ⏳';
  btn.disabled = true;

  try {
    if (currentEditType === 'new_section') {
      if (!LOCAL_DATA[currentEditPage].sections) LOCAL_DATA[currentEditPage].sections = [];
      const title = document.getElementById('newSectionTitle').value || 'Nueva Sección';
      const type = document.getElementById('newSectionType').value;
      if (type === 'table') LOCAL_DATA[currentEditPage].sections.push({ title: title, type: 'table', headers: ['Columna 1', 'Columna 2'], rows: [] });
      else LOCAL_DATA[currentEditPage].sections.push({ title: title, type: 'cards', cards: [] });
      await guardarEnFirebase(currentEditPage);

    } else if (currentEditType === 'bulk_table') {
      const trs = document.querySelectorAll('.bulk-row');
      const newRows = [];
      trs.forEach(tr => {
        const rowObj = {};
        const inputs = tr.querySelectorAll('.bulk-input');
        inputs.forEach(inp => { rowObj[inp.dataset.col] = inp.innerHTML; });
        newRows.push(rowObj);
      });
      LOCAL_DATA[currentEditPage].sections[currentEditSection].rows = newRows;
      await guardarEnFirebase(currentEditPage);

    } else if (currentEditType === 'row') {
      const rowObj = {};
      const headers = LOCAL_DATA[currentEditPage].sections[currentEditSection].headers || [];
      headers.forEach((_, idx) => { 
        rowObj[idx] = window.currentTableQuills[idx].root.innerHTML; 
      });
      LOCAL_DATA[currentEditPage].sections[currentEditSection].rows[currentEditIndex] = rowObj;
      await guardarEnFirebase(currentEditPage);

    } else if (currentEditType === 'new_row') {
      const rowObj = {};
      const headers = LOCAL_DATA[currentEditPage].sections[currentEditSection].headers || [];
      headers.forEach((_, idx) => { 
        rowObj[idx] = window.currentTableQuills[idx].root.innerHTML; 
      });
      if (!LOCAL_DATA[currentEditPage].sections[currentEditSection].rows) LOCAL_DATA[currentEditPage].sections[currentEditSection].rows = [];
      LOCAL_DATA[currentEditPage].sections[currentEditSection].rows.push(rowObj);
      await guardarEnFirebase(currentEditPage);

    } else if (currentEditType === 'card') {
      LOCAL_DATA[currentEditPage].sections[currentEditSection].cards[currentEditIndex] = {
        title: document.getElementById('cardTitleInput').value,
        body: window.currentQuill.root.innerHTML
      };
      await guardarEnFirebase(currentEditPage);

    } else if (currentEditType === 'new_card') {
      if (!LOCAL_DATA[currentEditPage].sections[currentEditSection].cards) LOCAL_DATA[currentEditPage].sections[currentEditSection].cards = [];
      LOCAL_DATA[currentEditPage].sections[currentEditSection].cards.push({
        title: document.getElementById('cardTitleInput').value,
        body: window.currentQuill.root.innerHTML
      });
      await guardarEnFirebase(currentEditPage);

    } else if (currentEditType === 'table_config') {
      const sec = LOCAL_DATA[currentEditPage].sections[currentEditSection];
      sec.title = document.getElementById('sectionTitleInput').value;

      if (sec.type === 'table') {
        const colRows = document.querySelectorAll('.col-edit-row');
        const newHeaders = [];
        const originalIndices = [];

        colRows.forEach(row => {
          newHeaders.push(row.querySelector('.col-name').value);
          const origIdx = row.getAttribute('data-original-index');
          originalIndices.push(origIdx !== null ? parseInt(origIdx) : -1); 
        });

        sec.headers = newHeaders;

        if (sec.rows) {
          sec.rows = sec.rows.map(oldRowObj => {
            const newRowObj = {};
            originalIndices.forEach((origIdx, newIdx) => {
              if (origIdx !== -1) newRowObj[newIdx] = oldRowObj[origIdx] !== undefined ? oldRowObj[origIdx] : '';
              else newRowObj[newIdx] = ''; 
            });
            return newRowObj;
          });
        }
      }
      await guardarEnFirebase(currentEditPage);

    } else if (currentEditType === 'menu_manager') {
      const rows = document.querySelectorAll('.menu-edit-row');
      const newCards = [];
      const batchPromises = []; 

      rows.forEach(row => {
        const icon = row.querySelector('.menu-icon').value || '📁';
        const id = row.querySelector('.menu-id').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, ''); 
        const title = row.querySelector('.menu-title').value;
        const desc = row.querySelector('.menu-desc').value;

        if (id && title) {
          newCards.push({ id, icon, title, desc });
          if (!LOCAL_DATA[id]) {
            LOCAL_DATA[id] = { title: title, meta: desc, sections: [] };
            batchPromises.push(setDoc(doc(db, "guias_ipc", id), LOCAL_DATA[id]));
          } else {
            if (LOCAL_DATA[id].title !== title || LOCAL_DATA[id].meta !== desc) {
              LOCAL_DATA[id].title = title;
              LOCAL_DATA[id].meta = desc;
              batchPromises.push(setDoc(doc(db, "guias_ipc", id), LOCAL_DATA[id]));
            }
          }
        }
      });

      LOCAL_DATA['home'].cards = newCards;
      await setDoc(doc(db, "guias_ipc", "home"), LOCAL_DATA['home']);
      if (batchPromises.length > 0) await Promise.all(batchPromises);

      renderSidebar(); 
      renderPage(currentPage); 
    }

    cerrarModal();
  } catch (err) {
    console.error("Error al salvar cambios:", err);
    alert("Hubo un error al sincronizar con la nube.");
  } finally {
    btn.textContent = 'Guardar Cambios';
    btn.disabled = false;
  }
});

async function guardarEnFirebase(pageKey) {
  const docRef = doc(db, "guias_ipc", pageKey);
  await setDoc(docRef, LOCAL_DATA[pageKey]);
  buildSearchIndex();
  renderPage(pageKey);
}

/* ============================================================
   MOTOR DE BÚSQUEDA GLOBAL ASÍNCRONO
   ============================================================ */
function stripHtml(html) {
   let tmp = document.createElement("DIV");
   tmp.innerHTML = html;
   return tmp.textContent || tmp.innerText || "";
}

function buildSearchIndex() {
  SEARCH_INDEX = [];
  for (const [key, page] of Object.entries(LOCAL_DATA)) {
    if (key === 'home') continue;
    for (const sec of (page.sections || [])) {
      if (sec.type === 'table' && sec.rows) {
        for (const row of sec.rows) {
          const rowArray = Object.values(row);
          SEARCH_INDEX.push({
            page: key, pageTitle: page.title, section: sec.title, type: 'row',
            headers: sec.headers, row: rowArray, text: rowArray.join(' ').toLowerCase()
          });
        }
      } else if (sec.type === 'cards' && sec.cards) {
        for (const c of sec.cards) {
          SEARCH_INDEX.push({
            page: key, pageTitle: page.title, section: sec.title, type: 'card',
            title: c.title, body: c.body, 
            text: (c.title + ' ' + stripHtml(c.body)).toLowerCase()
          });
        }
      }
    }
    if (page.notes) {
      for (const n of page.notes) {
        SEARCH_INDEX.push({
          page: key, pageTitle: page.title, section: 'Notas', type: 'note',
          body: n, text: n.toLowerCase()
        });
      }
    }
  }
}

function renderSearchResults(query) {
  const term = query.trim().toLowerCase();
  if (!term) { renderPage(currentPage || 'home'); return; }

  const results = SEARCH_INDEX.filter(r => r.text.includes(term));
  document.getElementById('pageTitle').textContent = `Búsqueda: "${query}"`;
  document.getElementById('pageMeta').textContent  = `${results.length} resultado${results.length !== 1 ? 's' : ''}`;

  if (!results.length) {
    document.getElementById('content').innerHTML = '<div class="empty">Sin resultados de coincidencia.</div>';
    return;
  }

  const groups = {};
  for (const r of results) {
    if (!groups[r.page]) groups[r.page] = { pageTitle: r.pageTitle, items: [] };
    groups[r.page].items.push(r);
  }

  let html = '';
  for (const [pageKey, group] of Object.entries(groups)) {
    html += `<div class="result-section">
      <div class="section-title">
        <span class="result-tag" data-go="${pageKey}">${escapeHTML(group.pageTitle)}</span>
        <span style="color:var(--text-muted);font-size:11px;font-weight:400;text-transform:none;letter-spacing:0">${group.items.length} coincidencia${group.items.length !== 1 ? 's' : ''}</span>
      </div>`;

    const bySection = {};
    for (const it of group.items) {
      if (!bySection[it.section]) bySection[it.section] = [];
      bySection[it.section].push(it);
    }

    for (const [secName, items] of Object.entries(bySection)) {
      if (items.every(i => i.type === 'row')) {
        const headers = items[0].headers;
        html += `<h4 style="font-size:12px;color:var(--text-dim);margin:10px 0 6px;font-weight:500">${escapeHTML(secName)}</h4>`;
        html += '<div class="table-wrap"><table>';
        if (headers && headers.length) {
          html += '<thead><tr>' + headers.map(h => `<th>${escapeHTML(h)}</th>`).join('') + '</tr></thead>';
        }
        html += '<tbody>';
        for (const it of items) {
          html += '<tr>' + it.row.map(cell => {
            const empty = cell === '' || cell === null || cell === undefined;
            const linked = linkify(cell);
            let finalCell = highlightInLinkedHtml(linked, term);
            if (cell === 'CHROME') finalCell = '<span class="pill chrome">CHROME</span>';
            else if (cell === 'EDGE') finalCell = '<span class="pill edge">EDGE</span>';
            return `<td${empty ? ' class="muted"' : ''}>${finalCell}</td>`;
          }).join('') + '</tr>';
        }
        html += '</tbody></table></div>';
      } else {
        html += `<h4 style="font-size:12px;color:var(--text-dim);margin:10px 0 6px;font-weight:500">${escapeHTML(secName)}</h4>`;
        for (const it of items) {
          if (it.type === 'card') {
            html += `<div class="card" style="width: 100%;"><h4>${escapeHTML(it.title)}</h4><div class="ql-editor">${highlightInLinkedHtml(it.body, term)}</div></div>`;
          } else if (it.type === 'note') {
            html += `<div class="notes"><p>${highlightInLinkedHtml(linkify(it.body), term)}</p></div>`;
          }
        }
      }
    }
    html += '</div>';
  }
  
  document.getElementById('content').innerHTML = html;
  document.querySelectorAll('.result-tag').forEach(t => {
    t.addEventListener('click', () => {
      document.getElementById('searchInput').value = '';
      currentPage = t.dataset.go;
      renderPage(currentPage);
      renderSidebar();
    });
  });
}

function highlightInLinkedHtml(html, term) {
  if (!term) return html;
  try {
    const re = new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return html.split(/(<[^>]+>)/).map(part => {
      if (part.startsWith('<')) return part;
      return part.replace(re, '<mark>$1</mark>');
    }).join('');
  } catch (e) { return html; }
}

/* ============================================================
   UTILIDADES COMUNES Y ESCUCHADORES DE EVENTOS
   ============================================================ */
function linkify(text) {
  if (text === null || text === undefined) return '';
  let html = escapeHTML(String(text));
  html = html.replace(/mailto:([\w._%+-]+@[\w.-]+\.[A-Za-z]{2,})/g, '<a class="mail" href="mailto:$1">$1</a>');
  html = html.replace(/(?<![\w@.:/])([\w._%+-]+@[\w.-]+\.[A-Za-z]{2,})(?![\w@])/g, '<a class="mail" href="mailto:$1">$1</a>');
  html = html.replace(/(https?:\/\/[^\s<>"']+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  html = html.replace(/(?<!\d)(\b[69]\d{8}\b)(?!\d)/g, '<a class="tel" href="tel:$1">$1</a>');
  return html;
}

function escapeHTML(str) {
  return String(str).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

let currentPage = 'home';
const searchInput = document.getElementById('searchInput');
let searchTimer;
searchInput.addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    const q = e.target.value;
    if (q.trim()) renderSearchResults(q);
    else renderPage(currentPage);
  }, 120);
});

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    searchInput.focus();
    searchInput.select();
  }
  if (e.key === 'Escape' && document.activeElement === searchInput) {
    searchInput.value = '';
    renderPage(currentPage);
    searchInput.blur();
  }
});

// Lanzar inicio de aplicación asíncrona
initApp();
</script>
