<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOPORTEC UNIR - Manual Técnico</title>

<!-- LIBRERÍAS DE EDITOR Y SEGURIDAD -->
<link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- FAVICON CON EMOJI -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧰</text></svg>">

<style>
  /* ===== TEMA CLARO CORPORATIVO (POR DEFECTO - ESTILO SOPORTEC) ===== */
  :root {
    --bg: #f4f5f7;
    --bg-elev: #ffffff;
    --bg-card: #f9fafb;
    --bg-hover: #f0f2f5;
    --border: #e2e8f0;
    --border-soft: #edf2f7;
    --text: #1e293b;
    --text-dim: #475569;
    --text-muted: #64748b;
    --accent: #e30613;
    --accent-soft: rgba(227, 6, 19, 0.08);
    --accent-hover: #b8000b;
    --danger: #dc2626;
    --success: #16a34a;
    --info: #0284c7;
    --warning: #d97706;
    --shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
    --shadow-accent: 0 4px 12px rgba(227, 6, 19, 0.14);
    --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.04);
    --radius: 8px;
    --radius-lg: 12px;
    --sidebar-w: 260px;
    --topbar-h: 58px;
    --transition: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* ===== MODO OSCURO OPCIONAL ===== */
  body.dark-mode {
    --bg: #0c1117;
    --bg-elev: #141b24;
    --bg-card: #1c2531;
    --bg-hover: #232e3c;
    --border: #263040;
    --border-soft: #1e2a37;
    --text: #dde4ed;
    --text-dim: #8fa0b4;
    --text-muted: #566880;
    --accent: #e30613;
    --accent-soft: rgba(227, 6, 19, 0.15);
    --accent-hover: #ff1f2d;
    --shadow: 0 12px 32px rgba(0,0,0,0.5);
    --shadow-accent: 0 4px 14px rgba(227, 6, 19, 0.25);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: 'DM Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    overflow: hidden;
  }

  /* ===== LAYOUT ===== */
  .app {
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    height: 100vh;
    transition: grid-template-columns var(--transition);
  }
  .app.sidebar-collapsed {
    grid-template-columns: 0px 1fr;
  }
  .app.sidebar-collapsed .sidebar {
    transform: translateX(-100%);
    pointer-events: none;
  }

  /* ===== SIDEBAR ===== */
  .sidebar {
    background: var(--bg-elev);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: transform var(--transition);
    position: relative;
    z-index: 20;
    box-shadow: var(--shadow-sm);
  }
  .sidebar-header {
    padding: 18px 16px 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .sidebar-header .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 3px;
  }
  .logo-mark {
    width: 40px; height: 30px;
    background: linear-gradient(135deg, var(--accent) 0%, #a80009 100%);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    color: #ffffff;
    font-size: 11px;
    letter-spacing: 0.8px;
    flex-shrink: 0;
    font-family: 'DM Mono', monospace;
    box-shadow: 0 2px 6px rgba(227,6,19,0.3);
  }
  .sidebar-header h1 {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.1px;
  }
  .sidebar-header .subtitle {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
    font-family: 'DM Mono', monospace;
  }

  .search-box {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    position: relative;
  }
  .search-input {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 32px 8px 11px;
    border-radius: var(--radius);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
  }
  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
    background: var(--bg-elev);
  }
  .search-input::placeholder { color: var(--text-muted); }
  .search-clear {
    position: absolute;
    right: 22px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none;
    color: var(--text-muted); cursor: pointer;
    font-size: 14px; display: none;
    padding: 2px;
  }
  .search-clear.visible { display: block; }

  .nav {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .nav::-webkit-scrollbar { width: 4px; }
  .nav::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .nav-section {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--text-muted);
    padding: 12px 16px 5px;
    font-weight: 700;
    font-family: 'DM Mono', monospace;
  }
  
  details.nav-group summary {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px;
    color: var(--text-dim); padding: 10px 16px; font-weight: 700;
    cursor: pointer; user-select: none; display: flex; align-items: center; gap: 8px;
    transition: all var(--transition); list-style: none; font-family: 'DM Mono', monospace;
    border-left: 3px solid transparent;
  }
  details.nav-group summary::-webkit-details-marker { display: none; }
  details.nav-group summary:hover { color: var(--accent); background: var(--bg-hover); }
  details.nav-group[open] summary { color: var(--accent); border-left-color: var(--accent); background: var(--accent-soft);}
  details.nav-group summary::after { content: '▼'; font-size: 9px; margin-left: auto; transition: transform 0.2s; transform: rotate(-90deg); }
  details.nav-group[open] summary::after { transform: rotate(0deg); }
  .nav-group-items { background: var(--bg-card); border-left: 1px solid var(--border); margin-left: 16px; padding: 4px 0; }
  .nav-group-items .nav-item { padding-left: 18px; font-size: 12.5px; }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 16px;
    color: var(--text-dim);
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: all var(--transition);
    font-size: 13px;
    position: relative;
  }
  .nav-item:hover {
    background: var(--bg-hover);
    color: var(--text);
  }
  .nav-item.active {
    background: var(--accent-soft);
    color: var(--accent);
    border-left-color: var(--accent);
    font-weight: 600;
  }
  .nav-icon {
    width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }

  .sidebar-footer {
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    background: var(--bg-card);
  }
  .sidebar-footer kbd {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 1px 5px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
  }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text-muted);
    display: inline-block;
  }
  .status-dot.online { background: var(--success); box-shadow: 0 0 0 2px rgba(22,163,74,0.2); }
  .status-dot.offline { background: var(--danger); }
  .status-dot.loading { background: var(--warning); animation: pulse-dot 1s infinite; }
  @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* ===== MAIN ===== */
  .main {
    overflow-y: auto;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    height: var(--topbar-h);
    background: var(--bg-elev);
    border-bottom: 2px solid var(--accent);
    padding: 0 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
    box-shadow: var(--shadow-sm);
  }
  .topbar-left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    flex: 1;
  }
  .sidebar-toggle {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    width: 32px; height: 32px;
    border-radius: 6px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all var(--transition);
    font-size: 16px;
  }
  .sidebar-toggle:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .topbar h2 {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .topbar .meta {
    color: var(--text-muted);
    font-size: 11.5px;
    font-family: 'DM Mono', monospace;
  }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .content { padding: 24px 28px 60px; flex: 1; max-width: 1480px; width: 100%; margin: 0 auto; }

  @keyframes pageIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .page-enter { animation: pageIn 0.22s cubic-bezier(0.4,0,0.2,1) both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ===== SKELETON ===== */
  .skeleton-wrap { padding: 4px 0; }
  .skeleton-line {
    background: linear-gradient(90deg, var(--border-soft) 25%, var(--border) 50%, var(--border-soft) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 4px;
    height: 14px;
    margin-bottom: 10px;
  }
  .skeleton-line.wide { width: 70%; }
  .skeleton-line.med { width: 50%; }
  .skeleton-line.short { width: 30%; }
  .skeleton-block {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* ===== CARRUSEL SUPERIOR ESTILO SOPORTEC ===== */
  .soportec-banner-wrap {
    margin-bottom: 22px;
    position: relative;
  }
  .soportec-carousel {
    background: var(--bg-elev);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-accent);
    border: 1px solid rgba(227, 6, 19, 0.25);
    position: relative;
  }
  .soportec-slide {
    display: none;
    flex-direction: column;
    animation: fadeIn 0.35s ease;
  }
  .soportec-slide.active {
    display: flex;
  }
  .soportec-slide-header {
    background: var(--accent);
    color: #ffffff;
    padding: 10px 20px;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
  }
  .soportec-slide-body {
    padding: 20px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    background: var(--bg-elev);
    flex-wrap: wrap;
  }
  .soportec-slide-text {
    font-size: 17px;
    color: var(--text);
    font-weight: 500;
    flex: 1;
    min-width: 240px;
    line-height: 1.45;
  }
  .soportec-slide-btn {
    background: var(--accent);
    color: #ffffff !important;
    padding: 9px 22px;
    border-radius: 25px;
    font-weight: 700;
    font-size: 13px;
    border: none;
    cursor: pointer;
    text-decoration: none !important;
    transition: background 0.2s, transform 0.2s;
    white-space: nowrap;
    box-shadow: 0 3px 8px rgba(227, 6, 19, 0.25);
  }
  .soportec-slide-btn:hover {
    background: var(--accent-hover);
    transform: scale(1.03);
  }
  .soportec-dots {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }
  .soportec-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #cbd5e1;
    cursor: pointer;
    transition: all 0.25s;
    border: none;
  }
  .soportec-dot.active {
    background: var(--accent);
    transform: scale(1.2);
  }

  /* ===== BUSCADOR CENTRAL PROTAGONISTA ===== */
  .hero-search-section {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px 24px;
    margin-bottom: 26px;
    box-shadow: var(--shadow-accent);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .hero-search-box {
    flex: 1;
    min-width: 280px;
    display: flex;
    gap: 10px;
    align-items: center;
    border: 1px solid var(--accent);
    padding: 6px 10px 6px 14px;
    border-radius: var(--radius);
    background: var(--bg-elev);
  }
  .hero-search-box input {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }
  .hero-search-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 7px 18px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.2s;
  }
  .hero-search-btn:hover { background: var(--accent-hover); }

  /* ===== AGRUPACIÓN BENTO GRID Y BOTONES ESTILO SOPORTEC ===== */
  .soportec-groups-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
    gap: 24px;
  }
  .soportec-group-area {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px 20px 22px;
    display: flex;
    flex-direction: column;
  }
  .soportec-group-title {
    color: var(--accent);
    font-size: 19px;
    font-weight: 400;
    margin-bottom: 14px;
    padding-left: 6px;
    letter-spacing: -0.2px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .soportec-group-box {
    background: var(--bg-elev);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: var(--shadow-accent);
    border: 1px solid rgba(227, 6, 19, 0.12);
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
    gap: 12px;
    flex: 1;
    align-content: start;
  }

  /* Píldora interactiva desplegable estilo SOPORTEC */
  .soportec-pill-card {
    background: var(--bg-elev);
    border-radius: 7px;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: transform 0.22s ease, box-shadow 0.22s ease;
    display: flex;
    flex-direction: column;
    align-self: start;
  }
  .soportec-pill-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 14px rgba(227, 6, 19, 0.22);
    border-color: var(--accent);
  }
  .soportec-pill-header {
    background: var(--accent);
    color: #ffffff;
    padding: 11px 13px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-weight: 600;
    font-size: 13px;
  }
  .soportec-pill-left {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .soportec-pill-icon {
    font-size: 15px;
    flex-shrink: 0;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.2));
  }
  .soportec-pill-title {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .soportec-pill-arrow {
    font-size: 16px;
    font-weight: 700;
    transition: transform 0.28s ease;
    flex-shrink: 0;
    line-height: 1;
  }
  .soportec-pill-card:hover .soportec-pill-arrow {
    transform: rotate(90deg);
  }
  .soportec-pill-body {
    max-height: 0;
    padding: 0 13px;
    overflow: hidden;
    background: var(--bg-elev);
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1.45;
    transition: max-height 0.35s ease, padding 0.25s ease;
  }
  .soportec-pill-card:hover .soportec-pill-body {
    max-height: 110px;
    padding: 10px 13px;
    border-top: 1px solid var(--border-soft);
  }

  /* ===== BREADCRUMB ===== */
  .breadcrumb {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 20px;
    font-family: 'DM Mono', monospace;
  }
  .breadcrumb span { cursor: pointer; transition: color var(--transition); }
  .breadcrumb span:hover { color: var(--accent); font-weight: 600; }
  .breadcrumb-sep { color: var(--border); }

  /* ===== SECTIONS & TABLES ===== */
  .section { margin-bottom: 26px; }
  .section-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--accent);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'DM Mono', monospace;
  }
  .section-title-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title-left::before {
    content: '';
    width: 4px; height: 14px;
    background: var(--accent);
    border-radius: 2px;
    display: inline-block;
  }

  .table-wrap {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow-x: auto;
    margin-bottom: 12px;
    box-shadow: var(--shadow-sm);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  thead {
    background: var(--bg-card);
    position: sticky;
    top: 0;
    z-index: 1;
  }
  th {
    position: relative;
    text-align: left;
    padding: 11px 14px;
    font-weight: 700;
    color: var(--accent);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    border-bottom: 2px solid var(--border);
    border-right: 1px solid var(--border-soft);
    font-family: 'DM Mono', monospace;
    white-space: nowrap;
  }
  .resizer {
    position: absolute;
    right: -3px; top: 0;
    width: 6px; height: 100%;
    cursor: col-resize;
    user-select: none;
    z-index: 10;
  }
  .resizer:hover, .resizer.resizing { background: var(--accent); }
  td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border-soft);
    border-right: 1px solid var(--border-soft);
    color: var(--text);
    vertical-align: top;
    white-space: pre-wrap;
  }
  th:last-child, td:last-child { border-right: none; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--accent-soft); }
  td.muted { color: var(--text-muted); }

  /* ===== PILLS ===== */
  .pill {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    font-family: 'DM Mono', monospace;
  }
  .pill.chrome { background: rgba(2,132,199,0.12); color: var(--info); border: 1px solid rgba(2,132,199,0.3); }
  .pill.edge   { background: rgba(22,163,74,0.12); color: var(--success); border: 1px solid rgba(22,163,74,0.3); }

  /* ===== CARDS INTERNAS ===== */
  .card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 12px;
    width: 100%;
    box-shadow: var(--shadow-sm);
    transition: border-color var(--transition);
  }
  .card:hover { border-color: var(--accent); }
  .card h4 {
    color: var(--accent);
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 10px;
    padding-bottom: 7px;
    border-bottom: 1px solid var(--border-soft);
    font-family: 'DM Mono', monospace;
  }

  /* ===== COMPACT TABLE MODE ===== */
  body.table-compact table      { font-size: 11.5px; }
  body.table-compact th         { padding: 6px 10px; font-size: 10px; }
  body.table-compact td         { padding: 5px 10px; line-height: 1.35; }
  body.table-compact .ql-editor { font-size: 11.5px; line-height: 1.35; }

  #compactBtn.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ===== NOTES ===== */
  .notes {
    background: rgba(2, 132, 199, 0.06);
    border-left: 4px solid var(--info);
    padding: 16px;
    border-radius: 0 var(--radius) var(--radius) 0;
    font-size: 13.5px;
    color: var(--text);
    margin-bottom: 12px;
  }

  /* ===== LINKS & UTILS ===== */
  a { color: var(--info); text-decoration: none; font-weight: 500; word-break: break-all; }
  a:hover { text-decoration: underline; }
  a.tel { color: var(--success); font-weight: 600; }
  a.mail { color: var(--accent); font-weight: 600; }
  mark { background: #fef08a; color: #1e293b; padding: 0 3px; border-radius: 3px; font-weight: 600; }
  .empty { text-align: center; color: var(--text-muted); padding: 60px 40px; font-style: italic; }

  /* ===== BUTTONS ===== */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: var(--radius);
    font-size: 12.5px; font-weight: 600; cursor: pointer;
    border: none; font-family: inherit; transition: all var(--transition);
    white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: #ffffff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary { background: var(--bg-card); border: 1px solid var(--border); color: var(--text); }
  .btn-secondary:hover { background: var(--bg-hover); border-color: var(--accent); color: var(--accent); }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
  .btn-ghost:hover { background: var(--bg-hover); color: var(--text); }
  .btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
  .btn-danger:hover { background: rgba(220,38,38,0.1); }
  .btn-info { background: var(--info); color: #fff; }
  .btn-info:hover { opacity: 0.9; }
  .btn-sm { padding: 5px 11px; font-size: 11.5px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ===== ADMIN ROLES ===== */
  .admin-only { display: none !important; }
  body.is-admin .admin-only { display: inline-flex !important; }
  body.is-admin th.admin-only, body.is-admin td.admin-only { display: table-cell !important; }
  body.is-admin div.admin-only { display: flex !important; }
  
  .draft-item { display: none !important; }
  body.is-admin .draft-item { display: block !important; }

  /* ===== MODAL ===== */
  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15, 23, 42, 0.55); display: flex; align-items: center; justify-content: center;
    z-index: 100; backdrop-filter: blur(4px);
    animation: fadeIn 0.15s ease both;
  }
  .modal-content {
    background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius-lg);
    width: 600px; max-width: 95%; padding: 0; box-shadow: var(--shadow);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    background: var(--bg-card);
  }
  .modal-header h3 { color: var(--accent); font-size: 15px; font-weight: 700; }
  .modal-close {
    background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-dim);
    width: 28px; height: 28px; border-radius: 6px;
    font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .modal-body {
    padding: 18px 20px; display: flex; flex-direction: column; gap: 14px;
    overflow-y: auto; flex: 1;
  }
  .modal-footer {
    display: flex; justify-content: flex-end; gap: 8px;
    border-top: 1px solid var(--border); padding: 12px 20px;
    background: var(--bg-card);
  }
  .modal-field { display: flex; flex-direction: column; gap: 5px; }
  .modal-field label { color: var(--text-dim); font-size: 11px; font-weight: 700; text-transform: uppercase; font-family: 'DM Mono', monospace; }
  .modal-field input, .modal-field textarea, .modal-field select {
    background: var(--bg-elev); border: 1px solid var(--border); color: var(--text);
    padding: 8px 12px; border-radius: var(--radius); font-family: inherit; font-size: 13px;
    outline: none;
  }
  .modal-field input:focus, .modal-field textarea:focus, .modal-field select:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .btn-action-ui { background: transparent; border: none; cursor: pointer; font-size: 14px; opacity: 0.55; transition: opacity var(--transition); padding: 3px; border-radius: 4px; }
  .btn-action-ui:hover { opacity: 1; background: var(--bg-hover); }

  /* ===== BULK EDIT & QUILL ===== */
  .bulk-input { width: 100%; min-width: 120px; background: transparent; border: none; color: var(--text); font-family: inherit; font-size: 13px; outline: none; padding: 6px 8px; }
  .bulk-input:focus { background: var(--accent-soft); }
  .bulk-input p { margin: 0; padding: 0; }

  .ql-toolbar.ql-snow { border: 1px solid var(--border) !important; background: var(--bg-card); border-radius: var(--radius) var(--radius) 0 0; }
  .ql-container.ql-snow { border: 1px solid var(--border) !important; background: var(--bg-elev); border-radius: 0 0 var(--radius) var(--radius); font-family: inherit; font-size: 13.5px; color: var(--text); }
  .ql-editor { font-family: inherit; line-height: 1.6; padding: 13px; }
  .quill-card-editor .ql-editor { min-height: 200px; }
  .quill-table-editor .ql-editor { min-height: 80px; max-height: 250px; overflow-y: auto; }
  .card .ql-editor, td .ql-editor { padding: 0; min-height: auto; overflow: visible; white-space: normal; }
  td .ql-editor p { margin: 0; padding: 0; }

  /* ===== TOAST & CONFIRM ===== */
  #toast-container {
    position: fixed; bottom: 24px; right: 24px;
    z-index: 9999; display: flex; flex-direction: column; gap: 8px;
    pointer-events: none;
  }
  .toast {
    display: flex; align-items: center; gap: 10px;
    background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 11px 16px;
    font-size: 13px; color: var(--text); font-weight: 500;
    box-shadow: var(--shadow);
    pointer-events: all;
    min-width: 220px; max-width: 360px;
  }
  .toast.success { border-left: 4px solid var(--success); }
  .toast.error   { border-left: 4px solid var(--danger); }
  .toast.info    { border-left: 4px solid var(--info); }
  .toast.warning { border-left: 4px solid var(--warning); }

  #confirmDialog {
    position: fixed; inset: 0;
    background: rgba(15, 23, 42, 0.55); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center;
    z-index: 200;
  }
  #confirmDialog.open { display: flex; }
  .confirm-box {
    background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 24px; max-width: 380px; width: 90%;
    box-shadow: var(--shadow);
  }
  .confirm-box h4 { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
  .confirm-box p  { font-size: 13px; color: var(--text-dim); margin-bottom: 20px; }
  .confirm-box .confirm-btns { display: flex; gap: 8px; justify-content: flex-end; }

  .result-section { margin-bottom: 24px; }
  .result-tag { cursor: pointer; color: var(--accent); font-weight: 700; font-size: 13px; }
  .result-tag:hover { text-decoration: underline; }

  @media (max-width: 780px) {
    .app { grid-template-columns: 0px 1fr; }
    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 50; transform: translateX(-100%); }
    .app.sidebar-open .sidebar { transform: translateX(0); }
    .soportec-groups-grid { grid-template-columns: 1fr; }
    .content { padding: 16px 14px 60px; }
    .topbar { padding: 0 14px; }
  }
</style>
</head>
